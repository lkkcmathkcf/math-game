<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色彩數獨：邏輯爭奪戰</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --accent: #e74c3c;
            /* 5種顏色 */
            --c1: #ff595e; /* 紅 */
            --c2: #ffca3a; /* 黃 */
            --c3: #1982c4; /* 藍 */
            --c4: #8ac926; /* 綠 */
            --c5: #9b5de5; /* 紫 (地獄局專屬) */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .screen { display: none; width: 100%; max-width: 600px; }
        .active { display: block; }
        
        h1, h2 { color: var(--primary); }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; }
        
        input { padding: 10px; margin: 10px 0; width: 80%; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; margin: 5px; }
        .btn-start { background-color: var(--primary); color: white; }
        .btn-start:hover { background-color: #1a252f; }
        .btn-skip { background-color: #95a5a6; color: white; }
        .btn-action { background-color: var(--accent); color: white; width: 100%; margin-top: 20px; }
        
        .tutorial-text { font-size: 18px; line-height: 1.6; text-align: left; }
        .highlight { color: var(--accent); font-weight: bold; }
        
        .header-info { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        #timer { color: var(--accent); font-size: 24px; }
        
        #map-container { display: grid; gap: 4px; background: #34495e; padding: 6px; border-radius: 8px; margin: 0 auto; width: fit-content; }
        .cell { background-color: white; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        
        /* 鎖定的提示格加上圖標表示不可更改 */
        .cell.locked { cursor: not-allowed; position: relative; }
        .cell.locked::after { content: "🔒"; font-size: 14px; position: absolute; opacity: 0.5; }
        
        .palette { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .color-btn { width: 50px; height: 50px; border-radius: 50%; border: 4px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-btn.selected { border-color: #2c3e50; transform: scale(1.15); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #ecf0f1; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active box">
        <h1>色彩數獨：極限邏輯戰</h1>
        <p>請輸入資料以記錄你的地獄局時間</p>
        <input type="text" id="player-class" placeholder="請輸入班別 (例: 2A)" required>
        <input type="text" id="player-id" placeholder="請輸入學號 (例: 15)" required>
        <button class="btn-start" onclick="startFlow()">準備挑戰</button>
    </div>

    <div id="tutorial-screen" class="screen box">
        <h2>📜 遊戲規則載入中...</h2>
        <div class="tutorial-text">
            <p>這不是普通的填色遊戲，這是<span class="highlight">色彩數獨 (拉丁方陣)</span>！</p>
            <ul>
                <li>目標：用提供的顏色填滿所有空白方格。</li>
                <li><b style="color:red;">絕對規則：</b> 每一橫行、每一直列，都<b style="color:red;">不能有重複的顏色</b>！</li>
                <li>帶有 🔒 的格子是初始線索，無法更改。</li>
            </ul>
            <p>熱身局為 4x4 (4色)，地獄局將升級為 5x5 (5色) 並開始計時！</p>
        </div>
        <p style="color: #7f8c8d;">進入遊戲倒數：<span id="loading-time">15</span> 秒</p>
        <button class="btn-skip" onclick="startBeginner()">我懂了，直接開始</button>
    </div>

    <div id="game-screen" class="screen box">
        <div class="header-info">
            <span id="level-title">初階挑戰 (4x4 暖身)</span>
            <span id="timer">00:00</span>
        </div>
        
        <div id="map-container"></div>
        
        <div class="palette" id="palette-container">
            <button class="color-btn" style="background-color: var(--c1);" onclick="selectColor('var(--c1)', this)"></button>
            <button class="color-btn" style="background-color: var(--c2);" onclick="selectColor('var(--c2)', this)"></button>
            <button class="color-btn" style="background-color: var(--c3);" onclick="selectColor('var(--c3)', this)"></button>
            <button class="color-btn" style="background-color: var(--c4);" onclick="selectColor('var(--c4)', this)"></button>
            <button class="color-btn" id="btn-c5" style="background-color: var(--c5); display: none;" onclick="selectColor('var(--c5)', this)"></button>
        </div>

        <button class="btn-start btn-action" onclick="checkWin()">提交答案</button>
        <p id="error-msg" style="color: red; font-weight: bold; display: none; margin-top: 15px;"></p>
    </div>

    <div id="result-screen" class="screen box">
        <h1>🎉 智商壓制！挑戰成功！</h1>
        <h2 id="final-time-display">你的地獄局時間：--:--</h2>
        
        <h3>🏆 邏輯大師風雲榜 (Top 5)</h3>
        <table>
            <thead>
                <tr><th>名次</th><th>班別</th><th>學號</th><th>時間 (秒)</th></tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        <button class="btn-start" onclick="location.reload()" style="margin-top: 20px;">換下一位挑戰者</button>
    </div>

    <script>
        let player = { class: "", id: "" };
        let currentColor = "";
        let currentMode = "";
        let timeElapsed = 0;
        let timerInterval;
        let mapData = { size: 0, locked: [] };

        // 題庫設計 (鎖定的提示格)
        const beginnerLevels = [
            // 4x4 題目
            [ {r:0, c:0, color:'var(--c1)'}, {r:1, c:2, color:'var(--c2)'}, {r:2, c:1, color:'var(--c3)'}, {r:3, c:3, color:'var(--c4)'} ]
        ];

        const advancedLevels = [
            // 5x5 地獄題目庫 (隨機抽一題)
            [ {r:0, c:1, color:'var(--c2)'}, {r:1, c:4, color:'var(--c3)'}, {r:2, c:2, color:'var(--c1)'}, {r:3, c:0, color:'var(--c5)'}, {r:4, c:3, color:'var(--c4)'} ],
            [ {r:0, c:0, color:'var(--c1)'}, {r:1, c:1, color:'var(--c2)'}, {r:2, c:2, color:'var(--c3)'}, {r:3, c:3, color:'var(--c4)'}, {r:4, c:4, color:'var(--c5)'} ],
            [ {r:0, c:3, color:'var(--c4)'}, {r:1, c:0, color:'var(--c5)'}, {r:2, c:4, color:'var(--c2)'}, {r:3, c:1, color:'var(--c1)'}, {r:4, c:2, color:'var(--c3)'} ]
        ];

        function startFlow() {
            const pClass = document.getElementById('player-class').value.trim();
            const pId = document.getElementById('player-id').value.trim();
            if(!pClass || !pId) return alert("同學，請輸入班別與學號喔！");
            
            player = { class: pClass, id: pId };
            switchScreen('login-screen', 'tutorial-screen');
            
            let timeLeft = 15;
            const loadTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('loading-time').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(loadTimer);
                    if(document.getElementById('tutorial-screen').classList.contains('active')) startBeginner();
                }
            }, 1000);
        }

        function startBeginner() {
            switchScreen('tutorial-screen', 'game-screen');
            currentMode = 'beginner';
            document.getElementById('level-title').innerText = "初階挑戰 (4x4 暖身局)";
            document.getElementById('timer').style.display = "none"; 
            document.getElementById('btn-c5').style.display = "none"; // 隱藏第五色
            
            generateMap(4, beginnerLevels[0]);
        }

        function startAdvanced() {
            currentMode = 'advanced';
            document.getElementById('level-title').innerText = "進階挑戰 (5x5 地獄局)";
            document.getElementById('timer').style.display = "block";
            document.getElementById('btn-c5').style.display = "block"; // 顯示第五色，紫氣東來
            
            const randomLevel = advancedLevels[Math.floor(Math.random() * advancedLevels.length)];
            generateMap(5, randomLevel);
            
            timeElapsed = 0;
            document.getElementById('timer').innerText = "0 秒";
            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer').innerText = timeElapsed + " 秒";
            }, 1000);
        }

        function generateMap(size, lockedCells) {
            mapData = { size, locked: lockedCells };
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            
            const cellSize = size === 4 ? 75 : 60; // 配合螢幕調整大小

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = `${cellSize}px`;
                    cell.style.height = `${cellSize}px`;
                    cell.id = `cell_${r}_${c}`;
                    
                    // 檢查是否為鎖定提示格
                    const lockedInfo = lockedCells.find(d => d.r === r && d.c === c);
                    if (lockedInfo) {
                        cell.classList.add('locked');
                        cell.style.backgroundColor = lockedInfo.color;
                        cell.dataset.color = lockedInfo.color;
                    } else {
                        cell.onclick = () => colorCell(cell);
                    }
                    container.appendChild(cell);
                }
            }
            document.getElementById('error-msg').style.display = 'none';
            currentColor = "";
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        }

        function selectColor(color, btn) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function colorCell(cell) {
            if (cell.classList.contains('locked')) return; // 鎖定格不能改
            if (!currentColor) return alert("請先從下方點選一種顏色當顏料！");
            cell.style.backgroundColor = currentColor;
            cell.dataset.color = currentColor;
        }

        function checkWin() {
            const errorMsg = document.getElementById('error-msg');
            const size = mapData.size;
            let allFilled = true;

            // 檢查是否全部填滿
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!document.getElementById(`cell_${r}_${c}`).dataset.color) {
                        allFilled = false;
                    }
                }
            }
            if (!allFilled) {
                showError("還有格子空著喔！請填滿所有格子。");
                return;
            }

            // 檢查行 (Row) 是否有重複
            for (let r = 0; r < size; r++) {
                let colorsInRow = new Set();
                for (let c = 0; c < size; c++) {
                    let color = document.getElementById(`cell_${r}_${c}`).dataset.color;
                    if (colorsInRow.has(color)) {
                        showError(`❌ 錯誤：第 ${r+1} 橫行出現了重複的顏色！`);
                        return;
                    }
                    colorsInRow.add(color);
                }
            }

            // 檢查列 (Column) 是否有重複
            for (let c = 0; c < size; c++) {
                let colorsInCol = new Set();
                for (let r = 0; r < size; r++) {
                    let color = document.getElementById(`cell_${r}_${c}`).dataset.color;
                    if (colorsInCol.has(color)) {
                        showError(`❌ 錯誤：第 ${c+1} 直列出現了重複的顏色！`);
                        return;
                    }
                    colorsInCol.add(color);
                }
            }

            // 成功過關
            errorMsg.style.display = "none";
            if (currentMode === 'beginner') {
                alert("🎉 熱身局完美破解！深呼吸，真正的地獄局要開始了！");
                startAdvanced();
            } else {
                clearInterval(timerInterval);
                saveAndShowResult();
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = msg;
            errorMsg.style.display = "block";
            // 讓錯誤訊息抖動一下吸引注意
            errorMsg.style.transform = "translateX(-5px)";
            setTimeout(() => errorMsg.style.transform = "translateX(5px)", 100);
            setTimeout(() => errorMsg.style.transform = "translateX(0)", 200);
        }

        function saveAndShowResult() {
            switchScreen('game-screen', 'result-screen');
            document.getElementById('final-time-display').innerText = `地獄局完成時間：${timeElapsed} 秒`;

            let leaderboard = JSON.parse(localStorage.getItem('sudokuColorLeaderboard')) || [];
            leaderboard.push({ class: player.class, id: player.id, time: timeElapsed });
            leaderboard.sort((a, b) => a.time - b.time);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem('sudokuColorLeaderboard', JSON.stringify(leaderboard));

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            leaderboard.forEach((entry, index) => {
                const tr = document.createElement('tr');
                // 前三名加上獎盃圖案
                let rankStr = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : index + 1;
                tr.innerHTML = `<td>${rankStr}</td><td>${entry.class}</td><td>${entry.id}</td><td>${entry.time}</td>`;
                tbody.appendChild(tr);
            });
        }

        function switchScreen(hideId, showId) {
            document.getElementById(hideId).classList.remove('active');
            document.getElementById(showId).classList.add('active');
        }
    </script>
</body>
</html>
