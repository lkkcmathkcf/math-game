<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四色領地：極限爭奪戰</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --accent: #e74c3c;
            /* 四色定理顏色 */
            --c1: #ff595e; /* 紅 */
            --c2: #ffca3a; /* 黃 */
            --c3: #1982c4; /* 藍 */
            --c4: #8ac926; /* 綠 */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .screen { display: none; width: 100%; max-width: 600px; }
        .active { display: block; }
        
        h1, h2 { color: var(--primary); }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; }
        
        input { padding: 10px; margin: 10px 0; width: 80%; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; margin: 5px; }
        .btn-start { background-color: var(--primary); color: white; }
        .btn-start:hover { background-color: #1a252f; }
        .btn-skip { background-color: #95a5a6; color: white; }
        .btn-action { background-color: var(--accent); color: white; width: 100%; margin-top: 20px; }
        
        /* 教學畫面 */
        .tutorial-text { font-size: 18px; line-height: 1.6; text-align: left; }
        .highlight { color: var(--accent); font-weight: bold; }
        
        /* 遊戲區域 */
        .header-info { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        #timer { color: var(--accent); font-size: 24px; }
        
        #map-container { display: grid; gap: 4px; background: #34495e; padding: 4px; border-radius: 8px; margin: 0 auto; }
        .cell { background-color: white; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        .cell.disabled { background-color: #34495e; cursor: not-allowed; } /* 挖空的區塊 */
        
        /* 調色盤 */
        .palette { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .color-btn { width: 50px; height: 50px; border-radius: 50%; border: 4px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-btn.selected { border-color: #2c3e50; transform: scale(1.1); }
        
        /* 排行榜 */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #ecf0f1; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active box">
        <h1>四色領地：極限爭奪戰</h1>
        <p>請輸入資料以記錄你的挑戰時間</p>
        <input type="text" id="player-class" placeholder="請輸入班別 (例: 1A)" required>
        <input type="text" id="player-id" placeholder="請輸入學號 (例: 15)" required>
        <button class="btn-start" onclick="startFlow()">開始挑戰</button>
    </div>

    <div id="tutorial-screen" class="screen box">
        <h2>📜 遊戲規則載入中...</h2>
        <div class="tutorial-text">
            <p>歡迎來到四色領地！你的任務是用四種顏色塗滿地圖。</p>
            <p class="highlight">⚠️ 黃金法則：</p>
            <ul>
                <li>只要是共用「同一條邊界」(上下左右) 的區塊，<b style="color:red;">絕對不能同色！</b></li>
                <li>如果只是角對角「頂點」碰到 (斜角)，則<b style="color:green;">可以同色！</b></li>
            </ul>
            <p>第一關是熱身局，第二關地獄局將會計時並列入排行榜。</p>
        </div>
        <p style="color: #7f8c8d;">進入遊戲倒數：<span id="loading-time">15</span> 秒</p>
        <button class="btn-skip" onclick="startBeginner()">跳過說明直接開始</button>
    </div>

    <div id="game-screen" class="screen box">
        <div class="header-info">
            <span id="level-title">初階挑戰 (熱身局)</span>
            <span id="timer">00:00</span>
        </div>
        
        <div id="map-container"></div>
        
        <div class="palette">
            <button class="color-btn" style="background-color: var(--c1);" onclick="selectColor('var(--c1)', this)"></button>
            <button class="color-btn" style="background-color: var(--c2);" onclick="selectColor('var(--c2)', this)"></button>
            <button class="color-btn" style="background-color: var(--c3);" onclick="selectColor('var(--c3)', this)"></button>
            <button class="color-btn" style="background-color: var(--c4);" onclick="selectColor('var(--c4)', this)"></button>
        </div>

        <button class="btn-start btn-action" onclick="checkWin()">檢查並完成</button>
        <p id="error-msg" style="color: red; font-weight: bold; display: none;"></p>
    </div>

    <div id="result-screen" class="screen box">
        <h1>🎉 挑戰完成！</h1>
        <h2 id="final-time-display">你的時間：--:--</h2>
        
        <h3>🏆 地獄局風雲榜 (Top 5)</h3>
        <table>
            <thead>
                <tr><th>名次</th><th>班別</th><th>學號</th><th>時間 (秒)</th></tr>
            </thead>
            <tbody id="leaderboard-body">
                </tbody>
        </table>
        <button class="btn-start" onclick="location.reload()" style="margin-top: 20px;">回到首頁換下一位</button>
    </div>

    <script>
        // 系統變數
        let player = { class: "", id: "" };
        let currentColor = "";
        let currentMode = ""; // 'beginner' 或 'advanced'
        let timeElapsed = 0;
        let timerInterval;
        let mapData = { rows: 0, cols: 0, disabled: [] };

        // 進階版地圖庫 (5種變化，陣列內為要挖空的座標 [row, col])
        const advancedMaps = [
            [], // Map 1: 完整的 5x5
            [[0,0], [4,4], [0,4], [4,0]], // Map 2: 砍掉四個角落 (21格)
            [[2,2], [1,1], [3,3]], // Map 3: 中間破洞 (22格)
            [[0,2], [1,2], [3,2], [4,2]], // Map 4: 被切分的 H 型 (21格)
            [[1,0], [1,4], [3,0], [3,4], [2,2]] // Map 5: 十字星型 (20格)
        ];

        function startFlow() {
            const pClass = document.getElementById('player-class').value.trim();
            const pId = document.getElementById('player-id').value.trim();
            if(!pClass || !pId) return alert("請輸入班別與學號！");
            
            player = { class: pClass, id: pId };
            switchScreen('login-screen', 'tutorial-screen');
            
            let timeLeft = 15;
            const loadTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('loading-time').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(loadTimer);
                    if(document.getElementById('tutorial-screen').classList.contains('active')){
                        startBeginner();
                    }
                }
            }, 1000);
        }

        function startBeginner() {
            switchScreen('tutorial-screen', 'game-screen');
            currentMode = 'beginner';
            document.getElementById('level-title').innerText = "初階挑戰 (熱身局)";
            document.getElementById('timer').style.display = "none"; 
            
            // 生成初階地圖 (3x4 = 12格)
            generateMap(3, 4, []);
        }

        function startAdvanced() {
            currentMode = 'advanced';
            document.getElementById('level-title').innerText = "進階挑戰 (地獄局)";
            document.getElementById('timer').style.display = "block";
            
            // 隨機挑選一張進階地圖 (5x5)
            const randomMapIndex = Math.floor(Math.random() * advancedMaps.length);
            generateMap(5, 5, advancedMaps[randomMapIndex]);
            
            // 開始計時
            timeElapsed = 0;
            document.getElementById('timer').innerText = "0 秒";
            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer').innerText = timeElapsed + " 秒";
            }, 1000);
        }

        function generateMap(rows, cols, disabledCells) {
            mapData = { rows, cols, disabled: disabledCells };
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            // 計算適合的大小
            const cellSize = currentMode === 'beginner' ? 80 : 60;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = `${cellSize}px`;
                    cell.style.height = `${cellSize}px`;
                    cell.id = `cell_${r}_${c}`;
                    
                    // 檢查是否為挖空區塊
                    const isDisabled = disabledCells.some(d => d[0] === r && d[1] === c);
                    if (isDisabled) {
                        cell.classList.add('disabled');
                    } else {
                        cell.onclick = () => colorCell(cell);
                    }
                    container.appendChild(cell);
                }
            }
            // 清除之前的錯誤訊息與顏色選擇
            document.getElementById('error-msg').style.display = 'none';
            currentColor = "";
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        }

        function selectColor(color, btn) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function colorCell(cell) {
            if (!currentColor) return alert("請先從下方選擇一種顏色！");
            cell.style.backgroundColor = currentColor;
            cell.dataset.color = currentColor;
        }

        function checkWin() {
            const errorMsg = document.getElementById('error-msg');
            let allFilled = true;
            let ruleBroken = false;

            for (let r = 0; r < mapData.rows; r++) {
                for (let c = 0; c < mapData.cols; c++) {
                    const cell = document.getElementById(`cell_${r}_${c}`);
                    if (cell.classList.contains('disabled')) continue;

                    const cellColor = cell.dataset.color;
                    if (!cellColor) {
                        allFilled = false;
                        continue;
                    }

                    // 檢查右邊 (共用邊界)
                    if (c + 1 < mapData.cols) {
                        const rightCell = document.getElementById(`cell_${r}_${c+1}`);
                        if (!rightCell.classList.contains('disabled') && rightCell.dataset.color === cellColor) {
                            ruleBroken = true;
                        }
                    }
                    // 檢查下方 (共用邊界)
                    if (r + 1 < mapData.rows) {
                        const bottomCell = document.getElementById(`cell_${r+1}_${c}`);
                        if (!bottomCell.classList.contains('disabled') && bottomCell.dataset.color === cellColor) {
                            ruleBroken = true;
                        }
                    }
                }
            }

            if (!allFilled) {
                errorMsg.innerText = "還有區塊沒塗到顏色喔！";
                errorMsg.style.display = "block";
                return;
            }
            if (ruleBroken) {
                errorMsg.innerText = "❌ 挑戰失敗：有相鄰(共用邊界)的區塊顏色相同！";
                errorMsg.style.display = "block";
                return;
            }

            // 成功過關
            errorMsg.style.display = "none";
            if (currentMode === 'beginner') {
                alert("🎉 熱身局過關！接下來進入地獄局（開始計時）！");
                startAdvanced();
            } else {
                clearInterval(timerInterval);
                saveAndShowResult();
            }
        }

        function saveAndShowResult() {
            switchScreen('game-screen', 'result-screen');
            document.getElementById('final-time-display').innerText = `你的時間：${timeElapsed} 秒`;

            // 存入 LocalStorage
            let leaderboard = JSON.parse(localStorage.getItem('fourColorLeaderboard')) || [];
            leaderboard.push({ class: player.class, id: player.id, time: timeElapsed });
            
            // 排序 (時間短的在前面) 並取前 5 名
            leaderboard.sort((a, b) => a.time - b.time);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem('fourColorLeaderboard', JSON.stringify(leaderboard));

            // 顯示排行榜
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            leaderboard.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${index + 1}</td><td>${entry.class}</td><td>${entry.id}</td><td>${entry.time}</td>`;
                tbody.appendChild(tr);
            });
        }

        function switchScreen(hideId, showId) {
            document.getElementById(hideId).classList.remove('active');
            document.getElementById(showId).classList.add('active');
        }
    </script>
</body>
</html>
